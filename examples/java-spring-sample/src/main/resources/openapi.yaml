openapi: 3.1.0
info:
  title: SDN Policy API
  version: 1.0.0
paths:
  /network-policies/{id}/deploy:
    post:
      operationId: deployNetworkPolicy
      responses:
        "200":
          description: Deployment accepted
components:
  schemas:
    PolicyDeployRequest:
      type: object
      properties:
        minimumBandwidthMbps:
          type: integer
          minimum: 0
