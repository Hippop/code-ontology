[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-ontology-platform"
version = "0.1.0"
description = "Executable Agent Gateway and deterministic change-planning slice for Code Ontology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "rdflib>=7.0,<8",
  "pyshacl>=0.28,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
]

[project.scripts]
code-ontology-platform = "code_ontology_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
